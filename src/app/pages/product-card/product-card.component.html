<article class="card product-card"><div class="product-art" [class.hotel]="product.category === 'Hospitality'" role="img" [attr.aria-label]="product.name + ' interface illustration'"><img *ngIf="product.imageUrl" [src]="product.imageUrl" [alt]="product.name + ' interface preview'" loading="lazy" style="width:100%;height:100%;object-fit:cover"><div class="art-window" *ngIf="!product.imageUrl"><div class="art-top"><i></i><i></i><i></i></div><div class="art-body"><div class="art-side"><i></i><i></i><i></i><i></i></div><div class="art-content"><b></b><div class="art-stats"><i></i><i></i><i></i></div><div class="art-bars"><i style="height:50%"></i><i style="height:80%"></i><i style="height:42%"></i><i style="height:95%"></i><i style="height:68%"></i></div></div></div></div></div><div class="category">{{ product.category }}</div><h3>{{ product.name }}</h3><p>{{ product.shortDescription }}</p><div class="tags"><span *ngFor="let feature of product.features.slice(0,3)">{{ feature }}</span></div><div class="price-line" *ngIf="startingPrice() as plan">Starting at <strong>{{ plan.currency }} {{ plan.price | number:'1.0-0' }}</strong> / {{ plan.billingFrequency.toLowerCase() }}</div><div class="product-actions"><a class="btn btn-primary btn-small" [routerLink]="['/products', product.slug]">View details →</a><a class="arrow-link" [routerLink]="['/request-demo']" [queryParams]="{ product: product.id }">Request demo ↗</a></div></article>

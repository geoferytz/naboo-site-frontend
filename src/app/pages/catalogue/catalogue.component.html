<section class="page-hero"><div class="container"><span class="eyebrow">NABOO SOFTWARE</span><h1>Software made for the way you work.</h1><p>Explore practical solutions designed to take the complexity out of business operations.</p></div></section><section class="section"><div class="container"><div class="filters"><button *ngFor="let category of categories" class="filter" [class.active]="selected===category" (click)="selected=category">{{category}}</button></div><label class="field" style="max-width:360px;margin-bottom:30px">Search products<input class="search-input" type="search" [(ngModel)]="search" placeholder="Search by name or feature"></label><div *ngIf="loading" class="loading">Loading products…</div><div *ngIf="error" class="status error">{{error}} <button class="btn btn-small btn-outline" (click)="load()">Retry</button></div><div class="grid grid-3" *ngIf="!loading && !error"><app-product-card *ngFor="let product of filtered" [product]="product" /></div><div *ngIf="!loading && !error && !filtered.length" class="empty">No products match your search.</div></div></section>
